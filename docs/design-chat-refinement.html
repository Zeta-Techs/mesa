<script>
// 自包含交互原型：所有运行、审批、文件差异均为样例，不连接 Agent、不读写项目。
const $=s=>document.querySelector(s);
const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state='done',permission='帮我批准',model='glm-5.3',files=[],quote='',queued=[],messages=[],toastTimer,dialogTrigger=null,panelTrigger=null,currentMenu='',pendingPermission='';
const sampleQuestion='「随手聊」节头换一个图标，别和对话管理撞。';
const sampleAnswer='「随手聊」已换成单个圆形气泡，与「对话管理」的双气泡分开。侧栏、项目选择器和新对话入口继续使用同一套图标。';
const processHTML=(open=false)=>`<details class="process" ${open?'open':''}><summary>${icon('chevron','chevron')}<span>查看过程</span><span>8 次操作</span><span class="duration">· 2 分 14 秒</span><span class="annotation">1</span></summary><div class="process-body"><div class="process-event">${icon('check','small')}<span>查阅入口与图标定义<small>4 个文件 · 使用现有图标体系</small></span><span class="event-meta">已完成</span></div><div class="process-event">${icon('check','small')}<span>更新两处图标引用<small><button class="file-link" data-panel="files">navigation-icons.ts · ProjectTree.tsx</button></small></span><span class="event-meta">已完成</span></div><div class="process-event">${icon('check','small')}<details><summary>前端测试通过</summary><pre>示例输出\nTests: 2394 passed, 0 failed\nProcess exited with code 0</pre></details></div><div class="process-event">${icon('check','small')}<details><summary>构建通过</summary><pre>示例输出\ntsc -b &amp;&amp; vite build\nProcess exited with code 0</pre></details></div></div></details>`;
function decision(kind){
 if(kind==='approval')return `<div class="decision"><div class="decision-heading">${icon('alert')}<h2>运行这条命令？</h2><span class="annotation">4</span></div><p>Agent 请求运行前端验证。命令及选项来自本次审批请求；只批准这一次。</p><pre>npm test</pre><p>工作目录：Ccode</p><div class="decision-actions"><button class="btn quiet" data-panel="terminal">查看终端</button><button class="btn" data-action="deny">拒绝这次</button><button class="btn primary" data-action="approve">允许这次 <kbd>⌘ ↵</kbd></button></div></div>`;
 if(kind==='error')return `<div class="decision"><div class="decision-heading"><span class="error">${icon('alert')}</span><h2>连接中断，回复还没完成</h2><span class="annotation">4</span></div><p>当前连接暂时不可用。已显示的内容和输入框草稿都保留着。</p><details class="process" style="margin:10px 0 0"><summary>${icon('chevron','chevron')}<span>查看错误详情</span></summary><pre>示例：服务返回 503 · Service unavailable</pre></details><div class="decision-actions"><button class="btn quiet" data-panel="terminal">查看终端</button><button class="btn" data-menu="connection">换连接接着聊</button><button class="btn primary" data-action="retry">重试连接</button></div></div>`;
 return `<div class="decision"><div class="decision-heading">${icon('terminal')}<h2>终端在等你</h2><span class="annotation">4</span></div><p>Agent 打开了一个选择面板，聊天层无法可靠读取选项。去终端选完，再回到这段对话继续。</p><div class="decision-actions"><button class="btn primary" data-panel="terminal">打开终端处理 ${icon('chevron','small')}</button></div></div>`;
}
function render(){
 const empty=state==='empty';
 $('#chat-title').textContent=empty?'新对话':'侧栏 UI 与功能优化点梳理';
 const history=`<div class="day">今天</div><div class="user-row"><div class="user">换成别的图标，命令面板里的那个就行，统一一下。</div></div><div class="previous"><p>「对话管理」的四处入口已统一使用双气泡图标。后续只改同一个定义，就能同步到各入口。</p></div><div class="user-row"><div class="user">${sampleQuestion}</div><div class="user-actions"><button class="text-btn" data-action="edit-question">${icon('edit','small')}编辑后重发</button></div></div>`;
 let body='';
 if(empty){body=`<div class="empty-start"><h2><span class="mesa-mark">M<span class="caret"></span></span>从这里接着做</h2><p>在 Ccode 里，给出你的问题或要完成的事。</p><div class="starter-list"><button data-starter="看看当前改动，指出还没验证的地方。">${icon('branch')}看看当前改动</button><button data-starter="根据项目文档，梳理聊天层下一步要完善的功能。">${icon('file')}梳理下一步工作</button><button data-menu="add">${icon('plus')}添加材料再开始</button></div></div>`;}
 else if(state==='done'){body=history+`<article class="round">${processHTML()}<div class="answer" id="answer"><p><strong>「随手聊」已换成单个圆形气泡</strong>，与「对话管理」的双气泡分开。</p><p>侧栏、项目选择器和新对话入口继续使用同一套图标：随手聊用圆气泡，新对话在它上面加一个加号。双气泡只留给对话管理。</p><p>图标定义收在 <button class="file-link" data-panel="files">navigation-icons.ts</button>，侧栏从这里取用；以后换图标，只需要改这一处。</p></div><div class="evidence"><button data-panel="files">${icon('file','small')}2 个文件 <span class="mono">+12 −8</span>${icon('chevron','small')}</button><button data-action="verification">${icon('check','small')}测试与构建通过</button><span class="annotation">2</span></div><div class="answer-actions"><button class="text-btn" data-action="copy">${icon('copy','small')}复制</button><button class="text-btn" data-action="quote">${icon('quote','small')}引用追问</button><button class="text-btn" data-action="fork">${icon('branch','small')}从这里分叉</button></div><div class="next-hint">可以继续补充要求，或打开文件查看差异。</div></article>`;}
 else if(state==='failed'){body=history+`<details class="process" open><summary>${icon('chevron','chevron')}<span>查看过程</span><span style="color:var(--warn)">1 条命令失败</span><span class="annotation">1</span></summary><div class="process-body"><div class="process-event">${icon('check','small')}<span>图标文件已修改</span></div><div class="process-event">${icon('alert','small')}<details open><summary>构建失败 · npm run build</summary><pre>示例输出：找不到导出的符号 ScratchIcon
Process exited with code 2</pre></details></div></div></details><div class="answer"><p><strong>图标引用已修改，构建还没通过。</strong></p><p>需要检查图标导出名，再重新验证。当前不能确认这次修改可用。</p></div><div class="decision-actions"><button class="btn" data-panel="files">查看相关文件</button><button class="btn primary" data-action="draft-retry">让它检查后重试</button></div>`;}
 else if(state==='running'){body=history+`<div class="process"><details><summary>已查阅 4 个文件，更新 2 处图标</summary><div class="process-body">图标定义与侧栏引用已对应；接下来核对测试结果。</div></details></div><div class="activity live"><span class="mesa-mark">M<span class="caret"></span></span><span>正在运行前端测试</span><span class="muted">· 38 秒</span><span class="annotation">1</span></div><p class="muted" style="font-size:13px;line-height:1.8">图标引用已经调整好，正在确认其余入口没有受影响。</p>`;}
 else{body=history+`<div class="activity"><span class="mesa-mark">M<span class="caret"></span></span><span>${state==='approval'?'图标已调整，等待运行验证':state==='error'?'连接出现问题':'需要你处理终端里的选项'}</span></div>`+decision(state);}
 body+=queued.map((q,i)=>`<div class="queued">${escapeHTML(q)}<small>已交给 Agent · 做完手头这一步就会看到</small><button class="text-btn" data-send-now="${i}">立即发送 ${icon('chevron','small')}</button></div>`).join('');
 body+=`<div class="followups">${messages.map(m=>`<div class="user-row"><div class="user">${escapeHTML(m)}</div></div><div class="followup-answer">${icon('check','small')} 示例消息已收到。这里仅演示发送后的状态，不会调用模型。</div>`).join('')}</div>`;
 $('#transcript').innerHTML=body;
 $('#stop').hidden=state!=='running';
 $('#permission-button').disabled=state==='running';
 $('#permission-button').title=state==='running'?'这一轮结束后可以切换权限':'选择这次对话的访问权限';
 $('#draft').placeholder=state==='running'?'继续补充，它做完这一步就会看到…':state==='approval'?'先处理上方请求，也可以继续写草稿…':empty?'输入问题，或描述你想完成的事…':'继续这段对话…';
 $('#send-hint').textContent=state==='running'?'Enter 下一步交给它 · 暂停会立即送出排队消息':'Enter 发送 · Shift Enter 换行';
 $('#scenario').value=state;
 syncSend();scrollBottom();
}
function setState(next){state=next;queued=[];render();}
function scrollBottom(){$('#scroll').scrollTop=$('#scroll').scrollHeight;$('#jump').hidden=true;}
function notify(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3600);}
function syncSend(){$('#send').disabled=!($('#draft').value.trim()||files.length);$('#send').setAttribute('aria-label',state==='running'?'下一步交给它':'发送消息');$('#send').title=state==='running'?'做完手头这一步就会看到；不是等整轮结束':'发送消息（Enter）';}
function openDialog(title,content,trigger=null,wide=false,anchored=false){
 const d=$('#dialog');if(d.open)d.close();dialogTrigger=trigger??document.activeElement;d.className=wide?'notes-dialog':anchored?'popover':'';d.style.left='';d.style.top='';$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=content;d.showModal();
 if(anchored&&trigger){const r=trigger.getBoundingClientRect();const box=d.getBoundingClientRect();d.style.left=Math.max(14,Math.min(innerWidth-box.width-14,r.right-box.width))+'px';d.style.top=Math.max(14,Math.min(innerHeight-box.height-14,r.top-box.height-8))+'px';}
}
function closeDialog(){const t=dialogTrigger;$('#dialog').close();currentMenu='';if(t?.isConnected)t.focus();}
function menu(name,trigger){
 currentMenu=name;let title='',html='';
 if(name==='model'){title='模型与思考';html=`<p>Claude Code · 当前会话</p>${['glm-5.3','glm-4.7'].map(n=>`<button class="option" data-model="${n}" aria-pressed="${model===n}"><span>${n}<small>来自此连接已配置的模型列表</small></span>${model===n?icon('check','small'):''}</button>`).join('')}<div class="option-group"><div class="range-label"><span>思考强度</span><span>此模型未提供可核实档位</span></div></div><div class="menu-note">聊天层 · 测试版<br>常用对话在这里完成；无法读取的终端面板会就近提示。</div><button class="text-btn" data-panel="terminal">${icon('terminal','small')}查看当前终端</button>`;}
 if(name==='permission'){title='这次对话的访问权限';html=`<p>换权限会重开 Agent，并接回这段对话。</p>${[['先出方案','先看、先出方案，你点头前不改文件、不跑命令。'],['请求批准','按这家 Agent 的原生规则请求批准。'],['帮我批准','日常操作交给 Agent 的自动审批机制。'],['完全访问','放开限制；改文件、跑命令不再先问。']].map(([n,s])=>`<button class="option" data-permission="${n}" aria-pressed="${permission===n}"><span>${n}<small>${s}</small></span>${permission===n?icon('check','small'):''}</button>`).join('')}<div class="menu-note">只影响这次对话，不修改本机全局设置。具体能力以这家 Agent 为准。</div>`;}
 if(name==='project'){title='工作目录';html=`<button class="option" aria-pressed="true" data-action="close-dialog"><span>Ccode<small>当前对话的项目</small></span>${icon('check','small')}</button><p>已开始的对话保持当前目录。要换到别的项目，可以在那里开一段新对话。</p>`;}
 if(name==='context'){title='上下文用量';html=`<p>示例：约 15.2 万 / 20 万 token（76%）。只有来源提供可靠的总量与上限时才显示百分比。</p><div style="height:5px;border-radius:3px;background:var(--line);margin:18px 0"><div style="width:76%;height:100%;background:var(--muted);border-radius:3px"></div></div><p>当前还能继续聊。压缩会保留摘要，部分细节可能不再出现在上下文里。</p><button class="btn" data-action="compress">压缩上下文…</button>`;}
 if(name==='add'){title='添加到消息';html=`<button class="option" data-action="pick-file">${icon('plus')}<span>文件或图片<small>选择本机文件；这里只展示文件名</small></span></button><button class="option" data-action="add-project-file">${icon('file')}<span>引用项目文件<small>输入 @ 也可以查找</small></span><kbd>@</kbd></button><button class="option" data-action="insert-skill">${icon('file')}<span>技能<small>插入示例技能引用</small></span></button><button class="option" data-action="insert-mcp">${icon('grid')}<span>MCP<small>引用工具的示例指令</small></span></button>`;}
 if(name==='more'){title='对话操作';html=`<button class="option" data-action="search"><span>搜索这段对话</span><kbd>⌘ F</kbd></button><button class="option" data-action="fork"><span>从最新回复分叉</span>${icon('branch','small')}</button><button class="option" data-action="compress"><span>压缩上下文…</span></button><button class="option" data-action="export"><span>导出示例 Markdown</span></button><button class="option" data-menu="preferences"><span>阅读设置</span></button>`;}
 if(name==='preferences'){title='阅读设置';html=`<p>以下设置只作用于设计稿。</p><div class="range-label"><label for="text-size">聊天字号</label><output id="text-size-value">${parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chat-size'))} px</output></div><input id="text-size" class="range" type="range" min="13" max="30" step="1" value="${parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chat-size'))}"><p>正文、过程和输入区同比放大，内容按可用宽度换行。</p>`;}
 if(name==='connection'){title='换连接，接着这段对话';html=`<p>示例中没有配置可用的备用连接。正式产品只列出同一家 Agent 可用的真实连接。</p><button class="btn" data-action="connection-settings">去连接页添加</button>`;}
 openDialog(title,html,trigger,false,true);
}
function panel(kind,trigger){
 if($('#dialog').open)closeDialog();panelTrigger=trigger??document.activeElement;$('#inspector').hidden=false;
 if(kind==='files'){$('#inspector-title').textContent='本轮改动 · 2 个文件';$('#inspector-body').innerHTML=`<p>以下是设计稿的示例差异。</p><button class="file-row" data-action="diff-one">${icon('file','small')}navigation-icons.ts<span class="mono">+8 −4</span></button><button class="file-row" data-action="diff-two">${icon('file','small')}ProjectTree.tsx<span class="mono">+4 −4</span></button><h3 id="diff-title" style="margin:18px 0 9px">navigation-icons.ts</h3><pre class="diff" id="diff-code"><span class="del">− scratch: MessagesSquare,</span><span class="add">+ scratch: MessageCircle,</span>  sessions: MessagesSquare,</pre><div class="side-note">文件查看沿用右侧详情区。正式接入时，仅显示已核实存在的文件与本轮确切差异；没有可靠归属时改写为「工作区改动」。</div>`;}
 else{$('#inspector-title').textContent='终端 · 同一个会话';$('#inspector-body').innerHTML=`<p>终端内容示例 · 返回聊天保留阅读位置</p><pre class="terminal-code">❯ npm test\n\nRunning frontend checks…\n\n${state==='terminal'?'Choose an option:\n› 1. Continue\n  2. Cancel':'Tests: 2394 passed\nExit code: 0'}</pre><div class="side-note">原型不接真实终端；这里演示明确的来回路径。</div><button class="btn" data-action="terminal-finish" style="margin-top:14px">${state==='terminal'?'模拟处理完成，回聊天':'返回聊天'}</button>`;}
 $('#inspector-title').focus();
}
function closePanel(){const t=panelTrigger;$('#inspector').hidden=true;if(t?.isConnected)t.focus();}
function notes(){openDialog('聊天层完善建议',`<p>这页是可交互设计提案，不是 Mesa 已实现的新版本。保留现有单栏阅读与输入区，不新增第二条会话头。</p><div class="note-block"><h3><span class="note-number">1</span>过程说清状态，正文承载结果</h3><p>沿用已有折叠过程；展开可看每一步及输出。失败写清影响与下一步，不能仅凭后来有回复就标成已恢复。</p></div><div class="note-block"><h3><span class="note-number">2</span>把可核实的交付放到回复旁</h3><p>两项轻入口：看文件、看验证依据。复用现有文件详情区；测试通过必须来自实际输出，不从模型的自述推断。</p></div><div class="note-block"><h3><span class="note-number">3</span>输入框成为一个完整操作区</h3><p>附件、权限、项目、上下文与模型在同一边框内。减少底边散落的小字；不重复显示 Agent 身份。菜单保留能力差异和重开确认。</p></div><div class="note-block"><h3><span class="note-number">4</span>异常都给明确的下一步</h3><p>批准、连接中断、终端等待共用一张就近卡片。权限不确定时不代答，终端由你主动打开。</p></div><div class="note-block"><h3>功能补全</h3><p>引用追问绑定来源消息；搜索命中定位原消息；运行中输入准确说明交付时机。原型的排队示例按 Claude Code 行为展示，不承诺所有 Agent 都可撤回。</p></div><div class="note-block"><h3>原有优点继续保留</h3><p>宽屏留白、回答不装气泡、过程默认折叠、暖色光标，以及模型和权限只出现一处。无需把聊天页改成监控仪表盘。</p></div><p>顶部可切 7 种状态，右侧菜单可看设计说明；主题与窄窗按钮只用于评审。</p>`,document.activeElement,true);}
function syncAttachments(){$('#attachments').innerHTML=files.map((f,i)=>`<div class="attachment">${icon('file','small')}<span>${escapeHTML(f)}</span><button type="button" data-remove-file="${i}" aria-label="移除 ${escapeHTML(f)}">×</button></div>`).join('');syncSend();}
function setQuote(t){quote=t;$('#draft-ref').hidden=!t;$('#quote-text').textContent=t;}
function sendMessage(){const draft=$('#draft').value.trim();if(!draft&&!files.length)return;const msg=(quote?'引用：'+quote+'\n\n':'')+draft+(files.length?'\n附件：'+files.join('、'):'');$('#draft').value='';files=[];setQuote('');syncAttachments();if(state==='running'){queued.push(msg);render();notify('已交给 Agent；做完手头这一步就会看到。');}else{messages.push(msg);if(state==='empty')state='done';render();notify('已发送示例消息；没有调用真实模型。');}$('#draft').focus();}
function searchDialog(){openDialog('搜索对话',`<label class="sr-only" for="search-input">搜索关键词</label><input id="search-input" class="search-input" placeholder="试试：图标、随手聊、测试"><div id="search-results"><p>在示例对话中查找内容。</p></div>`,document.activeElement);$('#search-input').focus();}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.menu){menu(b.dataset.menu,b);return;}
 if(b.dataset.panel){panel(b.dataset.panel,b);return;}
 if(b.dataset.starter){$('#draft').value=b.dataset.starter;syncSend();$('#draft').focus();return;}
 if(b.dataset.model){model=b.dataset.model;$('#model-label').textContent=model+' · 待确认';closeDialog();notify('示例切换已发起；读取 Agent 确认后才显示为生效。');return;}
 if(b.dataset.permission){if(b.dataset.permission===permission){closeDialog();return;}pendingPermission=b.dataset.permission;openDialog('重开并换权限？',`<p>将权限切换为「${escapeHTML(pendingPermission)}」。会停下 Agent，再接回这段对话。</p>${pendingPermission==='完全访问'?'<p style="color:var(--warn)">完全访问会放开文件修改与命令执行限制，包括删除和安装操作。</p>':''}<div class="dialog-footer"><button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-permission">重开并换权限</button></div>`,$('#permission-button'));return;}
 if(b.dataset.removeFile!==undefined){files.splice(Number(b.dataset.removeFile),1);syncAttachments();return;}
 if(b.dataset.sendNow!==undefined){const q=queued.splice(Number(b.dataset.sendNow),1)[0];messages.push(q);state='done';render();notify('示例：停下手头这一步，立即处理补充消息。');return;}
 switch(b.dataset.action){
 case 'close-dialog':closeDialog();break;
 case 'close-panel':closePanel();break;
 case 'sidebar':if(innerWidth<=780){$('#app').classList.toggle('rail-open');}else{$('#app').classList.toggle('rail-hidden');}break;
 case 'new':if($('#dialog').open)closeDialog();setState('empty');$('#draft').focus();break;
 case 'current':setState('done');break;
 case 'sample-chat':notify('侧栏用于展示上下文；此稿重点演示当前聊天。');break;
 case 'prototype-nav':notify('本页为聊天层设计稿，工作台保持现有入口。');break;
 case 'project':menu('project',b);break;
 case 'search':searchDialog();break;
 case 'search-result':{const term=$('#search-input').value;closeDialog();if(state==='empty')setState('done');const target=term==='测试'?$('.evidence'):$('#answer')??$('.user');target?.scrollIntoView({block:'center',behavior:'auto'});notify('已定位包含「'+term+'」的示例消息。');break;}
 case 'edit-question':$('#draft').value=sampleQuestion;syncSend();$('#draft').focus();break;
 case 'quote':setQuote(sampleAnswer);$('#draft').focus();notify('已引用这条回复，补充问题后再发送。');break;
 case 'unquote':setQuote('');$('#draft').focus();break;
 case 'copy':try{await navigator.clipboard.writeText(sampleAnswer);notify('已复制示例回复。');}catch{notify('浏览器未允许剪贴板写入，请选中文字复制。');}break;
 case 'fork':openDialog('从这里分叉',`<p>新对话会带上截至这条回复的背景。原对话保留。</p><div class="dialog-footer"><button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-fork">新开分叉对话</button></div>`,b);break;
 case 'confirm-fork':closeDialog();setState('empty');$('#chat-title').textContent='分叉 · 侧栏图标';setQuote('来源：侧栏图标对话，截至「随手聊」图标回复。');$('#draft').focus();notify('已创建示例分叉；没有改动真实对话。');break;
 case 'verification':{const p=$('.process');p.open=true;p.scrollIntoView({block:'center'});notify('展开验证步骤，可继续查看命令的实际输出示例。');break;}
 case 'approve':state='running';render();notify('已提交本次批准（示例），继续运行验证。');break;
 case 'deny':state='done';render();$('.round').innerHTML=`<div class="answer"><p>你拒绝了这次运行请求。验证没有执行；现有文件修改保留。</p></div>`;notify('仅拒绝这一次，不变更权限。');break;
 case 'draft-retry':$('#draft').value='检查 ScratchIcon 的导出与引用，修复后重新运行构建。';syncSend();$('#draft').focus();notify('已放入草稿，确认后发送。');break;
 case 'retry':state='running';render();notify('正在重试连接（示例）；草稿已保留。');break;
 case 'terminal-finish':closePanel();if(state==='terminal')setState('running');break;
 case 'pick-file':closeDialog();$('#file-input').click();break;
 case 'add-project-file':files.push('src/components/ProjectTree.tsx');closeDialog();syncAttachments();$('#draft').focus();break;
 case 'insert-skill':$('#draft').value+='请使用 apple-design 技能检查这处界面。';closeDialog();syncSend();$('#draft').focus();break;
 case 'insert-mcp':$('#draft').value+='请检查这个项目已配置的 MCP 工具。';closeDialog();syncSend();$('#draft').focus();break;
 case 'compress':openDialog('压缩这段对话的上下文？','<p>Agent 会用摘要替换部分上下文。对话记录保留，但接下来可能需要重新引用具体细节。</p><div class="dialog-footer"><button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-compress">开始压缩</button></div>',b);break;
 case 'confirm-compress':closeDialog();notify('已发起压缩示例；收到真实用量前不改百分比。');break;
 case 'confirm-permission':permission=pendingPermission;$('#permission-label').textContent=permission;$('#composer').classList.toggle('full',permission==='完全访问');$('#composer').classList.toggle('discuss',permission==='先出方案');$('.permission-glyph').innerHTML=permission==='先出方案'?'<path d="M13 2v12" stroke="currentColor" stroke-width="1.8"/><rect x="2.6" y="9.6" width="7" height="4" rx="1.2" fill="none" stroke="currentColor"/>':permission==='请求批准'?'<path d="M13 2v12" stroke="currentColor" stroke-width="1.8"/><rect x="4.6" y="9.6" width="7" height="4" rx="1.2" fill="currentColor"/>':permission==='完全访问'?'<path d="M1.5 11.6h8" stroke="currentColor" stroke-dasharray="1.5 2"/><rect x="12.6" y="9.6" width="7" height="4" rx="1.2" fill="currentColor"/>':'<path d="M13 2v6" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 2"/><rect x="9.5" y="9.6" width="7" height="4" rx="1.2" fill="currentColor"/>';closeDialog();notify('示例已接回原对话，权限切换为「'+permission+'」。');break;
 case 'connection-settings':closeDialog();notify('正式接入时打开连接页；当前原型没有真实连接配置。');break;
 case 'diff-one':$('#diff-title').textContent='navigation-icons.ts';$('#diff-code').innerHTML='<span class="del">− scratch: MessagesSquare,</span><span class="add">+ scratch: MessageCircle,</span>  sessions: MessagesSquare,';break;
 case 'diff-two':$('#diff-title').textContent='ProjectTree.tsx';$('#diff-code').innerHTML='<span class="del">− &lt;MessagesSquare size={14} /&gt;</span><span class="add">+ &lt;ScratchIcon size={14} /&gt;</span>';break;
 case 'export':{const blob=new Blob(['# Mesa 聊天层示例\n\n> 设计稿样例，非真实运行结果。\n\n'+sampleQuestion+'\n\n'+sampleAnswer],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mesa-chat-example.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);closeDialog();break;}
 }
});
$('#scenario').addEventListener('change',e=>setState(e.target.value));
$('#theme-button').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('#theme-label').textContent=light?'深色':'浅色';};
$('#size-button').onclick=()=>{const large=$('#size-button').getAttribute('aria-pressed')!=='true';$('#size-button').setAttribute('aria-pressed',String(large));document.documentElement.style.setProperty('--chat-size',large?'20px':'15px');};
$('#compact-button').onclick=()=>{const active=$('#app').classList.toggle('compact');$('#compact-button').setAttribute('aria-pressed',String(active));};
$('#notes-button').onclick=notes;
$('#annotate-button').onclick=()=>{const active=$('#app').classList.toggle('annotated');$('#annotate-button').setAttribute('aria-pressed',String(active));$('#annotate-button').textContent=active?'隐藏设计标注':'显示设计标注';};
$('#reset-button').onclick=()=>{messages=[];queued=[];files=[];setQuote('');$('#draft').value='';syncAttachments();closePanel();setState('done');notify('已重置示例对话。');};
$('#composer').onsubmit=e=>{e.preventDefault();sendMessage();};
$('#draft').addEventListener('input',syncSend);
$('#draft').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!((e.metaKey||e.ctrlKey)&&state==='approval')){e.preventDefault();sendMessage();}});
$('#file-input').onchange=e=>{files.push(...Array.from(e.target.files).map(f=>f.name));syncAttachments();e.target.value='';$('#draft').focus();};
$('#stop').onclick=()=>{const pending=queued.splice(0);messages.push(...pending);state='done';render();if(!pending.length){$('.round').innerHTML='<div class="answer"><p>已暂停。已完成的修改保留，验证还未结束。</p><p class="muted">可以补充要求后继续。</p></div>';}notify(pending.length?'已暂停，并立即处理排队消息（示例）。':'已暂停当前生成（示例）。');};
$('#jump').onclick=scrollBottom;
$('#scroll').addEventListener('scroll',()=>{$('#jump').hidden=$('#scroll').scrollHeight-$('#scroll').scrollTop-$('#scroll').clientHeight<160;});
$('#dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
document.addEventListener('input',e=>{if(e.target.id==='text-size'){document.documentElement.style.setProperty('--chat-size',e.target.value+'px');$('#text-size-value').textContent=e.target.value+' px';}if(e.target.id==='search-input'){const term=e.target.value.trim();const found=term&&(sampleAnswer+sampleQuestion+'测试').includes(term);$('#search-results').innerHTML=!term?'<p>在示例对话中查找内容。</p>':found?`<button class="option" data-action="search-result"><span>${escapeHTML(sampleQuestion)}<small>命中「${escapeHTML(term)}」· 点此定位回复</small></span>${icon('chevron','small')}</button>`:'<p>没有匹配内容，换个关键词试试。</p>';}});
document.addEventListener('keydown',e=>{if(e.isComposing)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'){e.preventDefault();searchDialog();}if(e.key==='Escape'&&!$('#dialog').open&&!$('#inspector').hidden){e.preventDefault();closePanel();}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&state==='approval'&&!$('#dialog').open){e.preventDefault();state='running';render();notify('已提交本次批准（示例）。');}});
render();
</script>
</body>
</html>
