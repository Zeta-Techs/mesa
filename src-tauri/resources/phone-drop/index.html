<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="发到 Mesa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>发到 Mesa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<main>
  <header>
    <h1>发到 Mesa</h1>
    <p id="status" class="status">已连上你的电脑。发出的东西会出现在 Mesa 里。</p>
  </header>

  <section id="tip" class="tip" hidden>
    <p><strong>已记住这台手机。</strong>把这个页面加到主屏幕，以后点开就能发，不用再扫码。</p>
    <p id="tip-ios" hidden>iPhone：点 Safari 底部的分享按钮，选「添加到主屏幕」。</p>
    <p id="tip-android" hidden>安卓：点 Chrome 右上角的 ⋮，选「添加到主屏幕」。</p>
    <p class="muted">电脑上开着 Mesa 就能发，发过去会在 Mesa 里自动弹出来。</p>
    <button id="tip-close" type="button">知道了</button>
  </section>

  <section class="picks">
    <label class="pick">
      <input id="camera" type="file" accept="image/*" capture="environment">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.2-1.8A1 1 0 0 1 9.5 4.8h5a1 1 0 0 1 .8.4L16.5 7h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.2"/></svg>
      <span>拍照</span>
    </label>
    <label class="pick">
      <input id="files" type="file" multiple>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 17 4.5-4.5 3 3L15 13l4 4"/></svg>
      <span>照片或文件</span>
    </label>
  </section>

  <form id="note" class="note" autocomplete="off">
    <textarea id="text" rows="3" placeholder="写一句话…" maxlength="20000"></textarea>
    <button id="send" type="submit" disabled>发送</button>
  </form>

  <ol id="sent" class="sent" aria-live="polite"></ol>

  <p class="foot">只在同一网络内传输，没有加密。在公共 Wi-Fi 上别传敏感文件。</p>
</main>
</body>
</html>
