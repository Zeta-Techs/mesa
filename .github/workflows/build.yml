name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# tauri-action 创建 Release 草稿需要写权限
permissions:
  contents: write

# vite 构建本机峰值约 3.6 GB；macOS arm64 runner 总内存 7 GB，Node 默认堆上限不够，
# 2026-10-30 实证 `npm run build` 报 JavaScript heap out of memory（exit 134）。
# 放在顶层：test job 的 npm run build 与 tauri-action 经 beforeBuildCommand 跑的构建都吃到
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux 本版本未开发，2026-09-22 移出测试矩阵（平台差异问题挡主线）；
        # 恢复 Linux 支持时把 ubuntu-latest 加回来
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: cargo test
        working-directory: src-tauri
      - run: npm run build

  package:
    name: tauri build (${{ matrix.label }})
    needs: test
    # 仅 tag 推送（含手动 dispatch 选择 tag ref）才打包建 Release 草稿；
    # 否则主线推送会以 tagName=main 建草稿甚至创建 main tag
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        # Linux 本版本不发安装包（2026-09-22，与 test 矩阵同批移除）；
        # 恢复时加一项 os: ubuntu-latest 即可（Linux 系统依赖步骤保留未删）
        # Intel Mac（2026-10-20 起出包）：在 Apple 芯片 runner 上交叉编译 x86_64，tauri-action
        # 把它并进同一个 latest.json 的 darwin-x86_64；mesa_helper 由 stage-sidecar 按目标三元组编
        include:
          - os: macos-latest
            label: macOS Apple 芯片
            args: ''
            rust_targets: ''
          - os: macos-latest
            label: macOS Intel
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - os: windows-latest
            label: Windows
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - name: Linux Tauri 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # macOS 签名公证：六个 APPLE_* secrets 配齐才启用（缺任一个就照旧出未签名包，首次打开要 xattr）。
      # 不能把空 secret 直接写进 tauri-action 的 env——值为空串的 APPLE_SIGNING_IDENTITY 也会让打包去签名、
      # 然后失败。配齐时经 GITHUB_ENV 交给后面的步骤（多行的证书 base64 用随机分隔符）
      - name: macOS 签名公证（配齐 APPLE_* secrets 才启用）
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keys="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          for k in $keys; do
            if [ -z "$(printenv "$k")" ]; then
              echo "::notice::没有配 $k：本次 macOS 包不签名、不公证"
              exit 0
            fi
          done
          for k in $keys; do
            d="APPLE_EOF_$(openssl rand -hex 8)"
            { echo "$k<<$d"; printenv "$k"; echo "$d"; } >> "$GITHUB_ENV"
          done
          echo "已启用 macOS 签名公证"
      - name: 校验 tag 与应用版本一致
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const conf = require("./src-tauri/tauri.conf.json").version;
            const pkg = require("./package.json").version;
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)[1];
            console.log({ tag, conf, pkg, cargo });
            if (tag !== conf || tag !== pkg || tag !== cargo) {
              console.error("发版 tag 必须与 package.json / tauri.conf.json / Cargo.toml 的 version 一致，否则 updater 不会提示已安装用户");
              process.exit(1);
            }
          '
      # 更新说明取自 CHANGELOG.md（latest.json 的 notes 在打包时生成，事后改 Release 草稿不会同步）
      - name: 取本版本更新说明
        id: notes
        shell: bash
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      # 应用内更新的国内镜像（docs/release.md）：仓库变量 UPDATE_MIRROR_BASE 配了才把镜像清单加到 updater
      # 地址的最前面（Tauri 按顺序试，镜像连不上再试 GitHub）；没配就只有 GitHub，源码里不写死不存在的域名
      - name: 更新镜像地址（配了 UPDATE_MIRROR_BASE 才加）
        if: vars.UPDATE_MIRROR_BASE != ''
        shell: bash
        env:
          MIRROR_BASE: ${{ vars.UPDATE_MIRROR_BASE }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { normalizeMirrorBase } from "./scripts/mirror-latest-json.mjs";
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(readFileSync(p, "utf8"));
            const mirror = normalizeMirrorBase(process.env.MIRROR_BASE) + "/latest.json";
            const rest = c.plugins.updater.endpoints.filter((e) => e !== mirror);
            c.plugins.updater.endpoints = [mirror, ...rest];
            writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            console.log("updater endpoints:", c.plugins.updater.endpoints);
          '
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名密钥（私钥内容 + 密码，需在 repo Settings → Secrets 配置；
          # 私钥本地存于 ~/.tauri/ccode-updater.key，勿提交 git）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Mesa ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          args: ${{ matrix.args }}

  # updater 查 latest.json 用的是裸键 windows-x86_64（插件不做 -nsis/-msi 后缀回退）。
  # 2026-10-01 审计：targets:"all" 时该键曾指向 MSI，NSIS 装机的用户更新会装出第二份
  # 应用。现已收窄 targets 只出 NSIS，这里逐版锁死：windows 必须指向 setup.exe。
  verify-release:
    name: 校验更新清单
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载草稿里的 latest.json 并校验
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ID=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq \
            '.[] | select(.draft and .tag_name == "${{ github.ref_name }}") | .id' | head -n1)
          if [ -z "$ID" ]; then echo "没找到 ${{ github.ref_name }} 的草稿 Release"; exit 1; fi
          ASSET=$(gh api "repos/${{ github.repository }}/releases/$ID" \
            --jq '.assets[] | select(.name == "latest.json") | .id' | head -n1)
          if [ -z "$ASSET" ]; then echo "草稿里没有 latest.json：tauri-action 没产出更新清单"; exit 1; fi
          gh api "repos/${{ github.repository }}/releases/assets/$ASSET" \
            -H "Accept: application/octet-stream" > latest.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const m = JSON.parse(readFileSync("latest.json", "utf8"));
            const p = m.platforms ?? {};
            const errs = [];
            const win = p["windows-x86_64"];
            if (!win) {
              errs.push("缺 windows-x86_64（updater 实际查找的键，不查 -nsis/-msi 后缀键）");
            } else {
              if (!String(win.url).endsWith("x64-setup.exe")) {
                errs.push("windows-x86_64 指向 " + win.url + " —— 必须是 NSIS setup.exe；指向 MSI 会让 NSIS 装机用户装出第二份应用");
              }
              if (!win.signature) errs.push("windows-x86_64 缺 minisign 签名");
            }
            const mac = p["darwin-aarch64"];
            if (!mac || !String(mac.url ?? "").endsWith(".app.tar.gz") || !mac.signature) {
              errs.push("darwin-aarch64 缺失，或不是 app.tar.gz + 签名");
            }
            const intel = p["darwin-x86_64"];
            if (!intel || !String(intel.url ?? "").endsWith(".app.tar.gz") || !intel.signature) {
              errs.push("darwin-x86_64（Intel Mac）缺失，或不是 app.tar.gz + 签名");
            } else if (mac && intel.url === mac.url) {
              errs.push("darwin-x86_64 与 darwin-aarch64 指向同一个包：Intel 构建的更新包被 Apple 芯片的覆盖了");
            }
            if (errs.length) { console.error(errs.join("\n")); process.exit(1); }
            console.log("latest.json 校验通过：Windows → NSIS setup.exe，macOS Apple 芯片 / Intel 各一个 app.tar.gz");
          '
      - name: 发版提醒
        run: |
          {
            echo "## 发版检查"
            echo ""
            echo "- ✅ latest.json 校验通过（Windows 更新包指向 NSIS setup.exe）"
            echo "- ⚠️ Release 还是草稿。releases/latest/download/latest.json 只对**已发布**的 Release 生效，不发布用户就收不到更新。"
            echo "- 发布入口：仓库 Releases 页 → 编辑该草稿 → Publish release。"
          } >> "$GITHUB_STEP_SUMMARY"
