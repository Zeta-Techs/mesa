name: cli-canary

# 每天装九家 CLI 的最新版（2026-10-22 从两家扩到九家），跑 scripts/cli-canary/canary.py：Mesa 依赖的请求形状、旁路、会话格式、
# 读屏和基线比。红了不是 Mesa 代码回退，是 CLI 变了——看 artifact 里的 report.md，Mesa 适配好之后在对应平台
# 跑一次 --accept 把新指纹提交成基线（README 见 scripts/cli-canary/README.md）。只是版本前进、指纹没变时
# 自动把核对版本前移并提交回 main（最后一步），不用人管
on:
  schedule:
    - cron: '17 1 * * *'   # 北京时间每天 9:17
  workflow_dispatch:

# 写权限只用来把「核对版本前移」的基线提交回主线（只动 scripts/cli-canary/baseline/，见最后一步）
permissions:
  contents: write

jobs:
  canary:
    name: CLI 金丝雀 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: 装最新版 CLI（npm 上的八家）
        run: >-
          npm install -g @anthropic-ai/claude-code@latest @openai/codex@latest @google/gemini-cli@latest
          @qwen-code/qwen-code@latest opencode-ai@latest @moonshot-ai/kimi-code@latest
          @tencent-ai/codebuddy-code@latest @xai-official/grok@latest
      # Cursor CLI 只有官方安装脚本；装不上不挡别的家（金丝雀会把没装的列为跳过）
      - name: 装 Cursor CLI（macOS）
        if: runner.os == 'macOS'
        continue-on-error: true
        run: curl https://cursor.com/install -fsS | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 装 Cursor CLI（Windows）
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: irm 'https://cursor.com/install?win32=true' | iex
      - name: 跑金丝雀
        shell: bash
        # --accept-unchanged：只是版本往前走、指纹没变的家，顺手把核对版本前移（随包进 Mesa，决定聊天层降不降级）；
        # 有变化 / 检查没过的家照旧报红，等人看报告
        run: python -I -X utf8 scripts/cli-canary/canary.py --accept-unchanged --out "$RUNNER_TEMP/canary"
      - name: 报告进摘要
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/canary/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: 核对版本前移的基线提交回主线
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain scripts/cli-canary/baseline)" ]; then echo "基线没变"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cli-canary/baseline
          git commit -m "chore：金丝雀核对版本前移（${{ runner.os }}）" \
            -m "CLI 版本往前走、指纹没变：canary.py --accept-unchanged 只挪了基线里的核对版本。"
          # macOS / Windows 两个任务可能前后脚推：先变基再推，最多试三次
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-${{ matrix.os }}
          path: ${{ runner.temp }}/canary
          retention-days: 14
