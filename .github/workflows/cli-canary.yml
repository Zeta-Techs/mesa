name: cli-canary

# 每天装 Claude Code / Codex 的最新版，跑 scripts/cli-canary/canary.py：Mesa 依赖的请求形状、旁路、会话格式、
# 读屏和基线比。红了不是 Mesa 代码回退，是 CLI 变了——看 artifact 里的 report.md，Mesa 适配好之后在对应平台
# 跑一次 --accept 把新指纹提交成基线（README 见 scripts/cli-canary/README.md）
on:
  schedule:
    - cron: '17 1 * * *'   # 北京时间每天 9:17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: CLI 金丝雀 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: 装最新版 CLI
        run: npm install -g @anthropic-ai/claude-code@latest @openai/codex@latest
      - name: 跑金丝雀
        shell: bash
        run: python -I -X utf8 scripts/cli-canary/canary.py --out "$RUNNER_TEMP/canary"
      - name: 报告进摘要
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/canary/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-${{ matrix.os }}
          path: ${{ runner.temp }}/canary
          retention-days: 14
