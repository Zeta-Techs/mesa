name: cli-canary

# 每天装九家 CLI 的最新版（2026-10-22 从两家扩到九家），跑 scripts/cli-canary/canary.py：Mesa 依赖的请求形状、旁路、会话格式、
# 读屏和基线比。红了不是 Mesa 代码回退，是 CLI 变了——看 artifact 里的 report.md，Mesa 适配好之后在对应平台
# 跑一次 --accept 把新指纹提交成基线（README 见 scripts/cli-canary/README.md）。只是版本前进、指纹没变时
# 自动把核对版本前移并提交回 main（最后一步），不用人管
on:
  schedule:
    - cron: '17 1 * * *'   # 北京时间每天 9:17
  workflow_dispatch:

# 写权限只用来把「核对版本前移」的基线提交回主线（只动 scripts/cli-canary/baseline/，见最后一步）；
# issues 写权限只用来发「上游有新的结构化通道」提醒（scripts/cli-canary/upstream_issue.py）
permissions:
  contents: write
  issues: write

jobs:
  canary:
    name: CLI 金丝雀 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: 装最新版 CLI（npm 上的八家）
        run: >-
          npm install -g @anthropic-ai/claude-code@latest @openai/codex@latest @google/gemini-cli@latest
          @qwen-code/qwen-code@latest opencode-ai@latest @moonshot-ai/kimi-code@latest
          @tencent-ai/codebuddy-code@latest @xai-official/grok@latest
      # Cursor CLI 只有官方安装脚本；装不上不挡别的家（金丝雀会把没装的列为跳过）
      - name: 装 Cursor CLI（macOS）
        if: runner.os == 'macOS'
        continue-on-error: true
        run: curl https://cursor.com/install -fsS | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 装 Cursor CLI（Windows）
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        # 安装器装到 %LOCALAPPDATA%\cursor-agent，只改用户 PATH、不进 runner 的 PATH，要手动补（2026-10-30：不补时 Windows 天天报 cursor「没装、跳过」）
        run: |
          irm 'https://cursor.com/install?win32=true' | iex
          "$env:LOCALAPPDATA\cursor-agent" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: 跑金丝雀
        shell: bash
        # --accept-unchanged：只是版本往前走、指纹没变的家，顺手把核对版本前移（随包进 Mesa，装好的 Mesa 也会从 main 取，决定聊天层降不降级）；
        # 有变化 / 检查没过的家照旧报红，等人看报告
        run: python -I -X utf8 scripts/cli-canary/canary.py --accept-unchanged --out "$RUNNER_TEMP/canary"
      # OpenCode 2.x（2026-11-04 起两版都支持）：与 1.x 同命令名、不能并存，上面那轮跑完换装 2.x，只跑 opencode2 那份基线。
      # 两个平台都跑（Windows 的 2.x 基线 2026-11-06 在 Windows 本机 --accept 建好）
      - name: 换装 OpenCode 2.x 再跑一轮（opencode2）
        if: always()
        shell: bash
        run: |
          npm uninstall -g opencode-ai
          npm install -g @opencode/cli@latest
          python -I -X utf8 scripts/cli-canary/canary.py --agents opencode2 --accept-unchanged --out "$RUNNER_TEMP/canary-opencode2"
      - name: 报告进摘要
        if: always()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/canary/report.md" >> "$GITHUB_STEP_SUMMARY" || true
          cat "$RUNNER_TEMP/canary-opencode2/report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # 上游通道雷达（不算红）：CLI 新出了能让聊天层更接近上游的通道（程序状态、本机服务、ACP…），或更新日志提到，
      # 开一条 issue / 追加评论，同一条只提醒一次。只在 macOS 这一路发（程序状态要伪终端才探得到，也免得两路抢着发）
      - name: 上游新通道提醒
        if: always() && runner.os == 'macOS' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sent=0
          for f in "$RUNNER_TEMP/canary/upstream-new.md" "$RUNNER_TEMP/canary-opencode2/upstream-new.md"; do
            if [ -s "$f" ]; then python3 -I scripts/cli-canary/upstream_issue.py "$f"; sent=1; fi
          done
          [ "$sent" = 1 ] || echo "没有要提醒的"
      - name: 核对版本前移的基线提交回主线
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain scripts/cli-canary/baseline)" ]; then echo "基线没变"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cli-canary/baseline
          git commit -m "chore：金丝雀核对版本前移（${{ runner.os }}）" \
            -m "CLI 版本往前走、指纹没变：canary.py --accept-unchanged 只挪了基线里的核对版本。"
          # macOS / Windows 两个任务可能前后脚推：先变基再推，最多试三次
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/canary
            ${{ runner.temp }}/canary-opencode2
          retention-days: 14
