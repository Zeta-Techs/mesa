<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa</title>
    <style>
      /* 首帧底色：跟随应用主题（localStorage.ccodeBootTheme，App 持久化；没存过值
         回落系统外观）。先不透明——WKWebView 加载期自铺的不透明白底层（lib.rs
         400ms 二次清底针对的就是它）只能被实心底罩住；400ms 后白底层已清，底色
         淡出成纯毛玻璃（窗口材质 + 桌面磨砂直接透出）。ready-to-show 隐藏亮窗
         方案试过被用户退回：无窗静默期读起来像卡死。减弱动态效果时不淡出
         （保持实心底整段过渡，宁实不白）。 */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      html {
        background: #eef0f4;
        animation: boot-frost 0.45s ease-out 0.4s forwards;
      }
      html[data-boot="dark"] {
        background: #11131a;
      }
      @keyframes boot-frost {
        to {
          background: transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          animation: none;
        }
      }
      /* React 挂上后交给 App.css：壳层透明，桌面磨砂从侧栏透出。
         这里的启动底不能盖过已挂载的页面。 */
      html:has(#root > :not(.boot-splash)) {
        background: transparent;
        animation: none;
      }
      /* 启动字标：与应用图标「光标 M_」同一个意思——字静止，只有琥珀光标在闪
         （终端里光标闪 = 在等）。光标用图标的品牌琥珀，不跟主题强调色走，同图标。
         整块先透明，0.2s 后才淡入：首屏数据很快就位时直接进应用，不闪一下字；
         慢的时候才看见。React 挂载后由 BootGate 以负 animation-delay 接上两段
         动画的进度（时长改这里要同步改 App.tsx 的 BOOT_* 常量），换手无跳变。 */
      .boot-splash {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #5d6474;
        font-family: -apple-system, "SF Pro", sans-serif;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 0.3em;
        opacity: 0;
        animation: boot-show 0.32s ease-out 0.2s forwards;
      }
      html[data-boot="dark"] .boot-splash {
        color: #8c93a3;
      }
      @keyframes boot-show {
        to {
          opacity: 1;
        }
      }
      /* 落在基线上的块状光标 + 一层同色柔光（图标里的荧光屏余辉）；
         字距本身留出与字母间同宽的空，光标不另加外边距。字与光标包在一个 span 里
         走行内排版——直接做 flex 子项光标会被 align-items 居中到 x 高度 */
      .boot-caret {
        display: inline-block;
        width: 0.5em;
        height: 0.14em;
        border-radius: 1px;
        background: #e39a1c;
        box-shadow: 0 0 8px rgba(227, 154, 28, 0.45);
        animation: boot-blink 1.1s ease-in-out infinite;
      }
      html[data-boot="dark"] .boot-caret {
        background: #f5b83d;
        box-shadow: 0 0 10px rgba(245, 184, 61, 0.5);
      }
      /* 亮的时间长、灭得短，转换各约 0.1s：像光标，不像闪烁警示 */
      @keyframes boot-blink {
        0%,
        50% {
          opacity: 1;
        }
        60%,
        90% {
          opacity: 0.15;
        }
        100% {
          opacity: 1;
        }
      }
      /* 换手：应用挂载时字标盖在上面淡出（BootGate 渲染 .boot-handoff 约 0.4s 后卸掉），
         与应用的淡入叠在一起，中间不露空磨砂。z-40 = 页面模态档（压过页头与标题栏，
         低于 toast），不造新档；不接点击。 */
      .boot-handoff {
        position: fixed;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        animation: boot-fadeout 0.3s ease-out forwards;
      }
      @keyframes boot-fadeout {
        to {
          opacity: 0;
        }
      }
      /* 应用挂载后整体淡入——排除字标与换手层，它们有自己的动画 */
      #root > :not(.boot-splash):not(.boot-handoff) {
        animation: boot-fadein 0.3s ease-out;
      }
      @keyframes boot-fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* 减弱动态效果：光标常亮不闪；淡入淡出属于溶解、不是位移，保留 */
      @media (prefers-reduced-motion: reduce) {
        .boot-caret {
          animation: none;
        }
      }
    </style>
    <script>
      // 首帧前同步定启动底色（浅/深）。localStorage 不可用（隐私模式等）回落系统外观。
      try {
        var boot = localStorage.getItem("ccodeBootTheme");
        if (boot !== "light" && boot !== "dark") {
          boot = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.boot = boot;
      } catch (e) {
        document.documentElement.dataset.boot = matchMedia("(prefers-color-scheme: dark)")
          .matches
          ? "dark"
          : "light";
      }
    </script>
  </head>

  <body>
    <div id="root">
      <div class="boot-splash"><span>Mesa<i class="boot-caret"></i></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
